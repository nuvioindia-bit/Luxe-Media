name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm install

      # =======================================================
      # STRICT NATIVE LAYOUT LOCK (YOUR PERFECT WORKING LAYOUT)
      # =======================================================
      - name: Automated Mobile View & Native Layout Lock
        run: |
          echo "Injecting viewport-fit=cover into HTML..."
          if [ -f index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' index.html
          fi
          if [ -f public/index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' public/index.html
          fi

          echo "Enforcing strict screen containment and fixing clipped bottom navigation bar..."
          for css_file in src/index.css src/App.css src/main.css; do
            if [ -f "$css_file" ]; then
              echo -e "\n/* Strict Native App Fit & Bottom Bar Fix */\n* {\n  box-sizing: border-box !important;\n}\nhtml, body {\n  margin: 0 !important;\n  padding: 0 !important;\n  width: 100% !important;\n  height: 100dvh !important;\n  overflow: hidden !important;\n  position: fixed !important;\n}\n#root {\n  width: 100% !important;\n  height: 100dvh !important;\n  max-width: 480px !important;\n  margin: 0 auto !important;\n  position: relative !important;\n}\n#root > * {\n  height: 100% !important;\n  display: flex !important;\n  flex-direction: column !important;\n  overflow: hidden !important;\n  padding-top: env(safe-area-inset-top, 24px) !important;\n  padding-bottom: env(safe-area-inset-bottom, 12px) !important;\n}" >> "$css_file"
            fi
          done

          - name: Build Web App
            run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      # =======================================================
      # SYSTEM ENGINE INSTALLATION (FOR COMPILING IMAGE ASSETS)
      # =======================================================
      - name: Install ImageMagick Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # =======================================================
      # UNBREAKABLE ASSET GENERATOR (FIXES ICONS & SPLASH SCREENS)
      # =======================================================
      - name: Generate Clean Production Icons & Splash Screens
        run: |
          echo "Wiping old launcher and splash resources to clear corruption..."
          find android/app/src/main/res/ -name "ic_launcher*.png" -delete || true
          find android/app/src/main/res/ -name "splash*.png" -delete || true
          
          echo "Searching for icon/logo globally..."
          SRC_ICON=$(find . -type f \( -iname "icon.png" -o -iname "logo.png" \) -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1)
          
          if [ -z "$SRC_ICON" ] || [ ! -f "$SRC_ICON" ]; then
            echo "No custom icon found, generating a safe default..."
            convert -size 1024x1024 xc:#3b82f6 assets_fallback_icon.png
            SRC_ICON="assets_fallback_icon.png"
          fi
          
          echo "Searching for splash screen globally..."
          SRC_SPLASH=$(find . -type f \( -iname "splash.png" \) -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1)
          if [ -z "$SRC_SPLASH" ] || [ ! -f "$SRC_SPLASH" ]; then
            echo "No custom splash found, matching with icon background..."
            SRC_SPLASH="$SRC_ICON"
          fi

          # Generate Icons
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          convert "$SRC_ICON" -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC_ICON" -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          convert "$SRC_ICON" -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert "$SRC_ICON" -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC_ICON" -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          convert "$SRC_ICON" -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert "$SRC_ICON" -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC_ICON" -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$SRC_ICON" -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert "$SRC_ICON" -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC_ICON" -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$SRC_ICON" -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert "$SRC_ICON" -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC_ICON" -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          convert "$SRC_ICON" -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Generate Splash Screens (Bypasses the exact failing folders)
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/drawable-land-mdpi
          mkdir -p android/app/src/main/res/drawable-port-mdpi
          mkdir -p android/app/src/main/res/drawable-land-hdpi
          mkdir -p android/app/src/main/res/drawable-port-hdpi
          mkdir -p android/app/src/main/res/drawable-land-xhdpi
          mkdir -p android/app/src/main/res/drawable-port-xhdpi
          mkdir -p android/app/src/main/res/drawable-land-xxhdpi
          mkdir -p android/app/src/main/res/drawable-port-xxhdpi

          convert "$SRC_SPLASH" -resize 512x512! android/app/src/main/res/drawable/splash.png
          convert "$SRC_SPLASH" -resize 480x320! android/app/src/main/res/drawable-land-mdpi/splash.png
          convert "$SRC_SPLASH" -resize 320x480! android/app/src/main/res/drawable-port-mdpi/splash.png
          convert "$SRC_SPLASH" -resize 800x480! android/app/src/main/res/drawable-land-hdpi/splash.png
          convert "$SRC_SPLASH" -resize 480x800! android/app/src/main/res/drawable-port-hdpi/splash.png
          convert "$SRC_SPLASH" -resize 1280x720! android/app/src/main/res/drawable-land-xhdpi/splash.png
          convert "$SRC_SPLASH" -resize 720x1280! android/app/src/main/res/drawable-port-xhdpi/splash.png
          convert "$SRC_SPLASH" -resize 1600x960! android/app/src/main/res/drawable-land-xxhdpi/splash.png
          convert "$SRC_SPLASH" -resize 960x1600! android/app/src/main/res/drawable-port-xxhdpi/splash.png
          
          rm -f assets_fallback_icon.png
          echo "All icons and splash assets fully compiled with strict production standards!"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle System (Bypass Wrapper Jar)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # Direct Global Gradle se Release APK build
      - name: Build APK (Release)
        run: |
          cd android
          gradle assembleRelease
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/
          
