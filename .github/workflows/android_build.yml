name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm install

      # ==========================================
      # STRICT NATIVE LAYOUT LOCK (FIXES BOUNCY SCROLL)
      # ==========================================
      - name: Automated Mobile View & Native Layout Lock
        run: |
          echo "Injecting viewport-fit=cover into HTML..."
          if [ -f index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' index.html
          fi
          if [ -f public/index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' public/index.html
          fi

          echo "Enforcing strict screen containment and status bar margins via CSS..."
          for css_file in src/index.css src/App.css src/main.css; do
            if [ -f "$css_file" ]; then
              echo -e "\n/* Strict Native App Fit */\nhtml, body, #root {\n  position: fixed !important;\n  top: 0 !important;\n  left: 0 !important;\n  width: 100% !important;\n  height: 100dvh !important;\n  overflow: hidden !important;\n  padding-top: env(safe-area-inset-top, 24px) !important;\n  padding-bottom: env(safe-area-inset-bottom, 16px) !important;\n  max-width: 480px !important;\n  margin: 0 auto !important;\n}" >> "$css_file"
            fi
          done

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      # ==========================================
      # AUTOMATED CLOUD ICON GENERATOR
      # ==========================================
      - name: Generate Real Android Icons on Cloud
        run: |
          echo "Installing Capacitor Assets Tool..."
          npm install @capacitor/assets --save-dev
          echo "Generating responsive Android icons from assets/icon.png..."
          npx cap assets generate --android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle System (Bypass Wrapper Jar)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # Direct Global Gradle se Real Icon ke sath Release APK build
      - name: Build APK (Release)
        run: |
          cd android
          gradle assembleRelease
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/
          
