name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm install

      # ==========================================
      # AUTOMATED MOBILE VIEW & STATUS BAR FIX STEP
      # ==========================================
      - name: Automated Mobile View & Layout Fixer
        run: |
          echo "Injecting viewport-fit=cover into HTML files..."
          if [ -f index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' index.html
          fi
          if [ -f public/index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' public/index.html
          fi

          echo "Injecting Safe-Area Padding & Max-Width Fluid Layout into CSS..."
          for css_file in src/index.css src/App.css src/main.css; do
            if [ -f "$css_file" ]; then
              echo -e "\n/* Automated Mobile View Fix */\nhtml, body, #root {\n  padding-top: env(safe-area-inset-top, 24px) !important;\n  padding-bottom: env(safe-area-inset-bottom, 16px) !important;\n  max-width: 480px !important;\n  margin-left: auto !important;\n  margin-right: auto !important;\n  min-height: 100dvh !important;\n}" >> "$css_file"
            fi
          done
          echo "Global responsiveness injection complete!"

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      # AAPT2 compiler crash se bachne ke liye safe asset generator
      - name: Auto-Fix Corrupt Assets (Icons & Splash Screens)
        run: |
          find android/app/src/main/res/ -name "ic_launcher*.png" -exec sh -c 'echo "" | base64 -d > "{}"' \;
          find android/app/src/main/res/ -name "splash*.png" -exec sh -c 'echo "" | base64 -d > "{}"' \;

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle System (Bypass Wrapper)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # Testing ke liye Debug APK jo bina security crash ke install hoga
      - name: Build APK via Global Gradle (Debug Version)
        run: |
          cd android
          gradle assembleDebug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
