name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm install

      # =======================================================
      # HIGH-PERFORMANCE NATIVE LAYOUT LOCK (NO LAG / NO BOUNCE)
      # =======================================================
      - name: Automated Mobile View & GPU Optimized Layout
        run: |
          echo "Injecting viewport-fit=cover into HTML..."
          if [ -f index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' index.html
          fi
          if [ -f public/index.html ]; then
            sed -i 's/<meta name="viewport" content="[^"]*"/<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/g' public/index.html
          fi

          echo "Enforcing smooth hardware-accelerated CSS containment..."
          for css_file in src/index.css src/App.css src/main.css; do
            if [ -f "$css_file" ]; then
              echo -e "\n/* High-Performance Native Lock */\nhtml, body {\n  margin: 0 !important;\n  padding: 0 !important;\n  width: 100% !important;\n  height: 100dvh !important;\n  overflow: hidden !important;\n  position: fixed !important;\n  contain: strict !important;\n}\n#root {\n  width: 100% !important;\n  height: 100dvh !important;\n  max-width: 480px !important;\n  margin: 0 auto !important;\n  position: relative !important;\n  display: flex !important;\n  flex-direction: column !important;\n  overflow: hidden !important;\n  padding-top: env(safe-area-inset-top, 24px) !important;\n  padding-bottom: env(safe-area-inset-bottom, 12px) !important;\n  will-change: transform !important;\n}" >> "$css_file"
            fi
          done

      - name: Build Web App (Production Mode)
        run: |
          export GENERATE_SOURCEMAP=false
          npm run build

      - name: Capacitor Sync
        run: npx cap sync android

      # =================================================================
      # DIRECT NATIVE ICON GENERATOR (BYPASS BUGGY THIRD-PARTY TOOLS)
      # =================================================================
      - name: Generate Clean Production Icons from Real Icon
        run: |
          echo "Wiping any old or corrupt launcher resources from android folder..."
          find android/app/src/main/res/ -name "ic_launcher*.png" -delete || true
          
          if [ -f assets/icon.png ]; then
            echo "Processing real assets/icon.png using pre-installed system ImageMagick..."
            
            # Target mipmap directories secure kar rahe hain
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            
            # Strict Android standard sizes generator (No extra metadata or bad color profiles)
            convert assets/icon.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert assets/icon.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
            convert assets/icon.png -resize 48x48! android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            
            convert assets/icon.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert assets/icon.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            convert assets/icon.png -resize 72x72! android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            
            convert assets/icon.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert assets/icon.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert assets/icon.png -resize 96x96! android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            
            convert assets/icon.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert assets/icon.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert assets/icon.png -resize 144x144! android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            
            convert assets/icon.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert assets/icon.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
            convert assets/icon.png -resize 192x192! android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            echo "Real brand icons generated with perfect production standards successfully!"
          else
            echo "ERROR: assets/icon.png not found!"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle System (Bypass Wrapper Jar)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # Sahi icon aur smooth screen performance ke sath Release APK Build
      - name: Build APK (Release)
        run: |
          cd android
          gradle assembleRelease
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/
          
